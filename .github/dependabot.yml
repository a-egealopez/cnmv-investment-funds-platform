version: 2

updates:
  # Workflow actions (checkout, setup-python, docker/*, trivy...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies pinned in requirements/*.txt
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  # Base images in docker/*/Dockerfile and airflow/Dockerfile
  - package-ecosystem: docker
    directories:
      - /docker/ingestion
      - /docker/spark
      - /docker/dbt
      - /airflow
    schedule:
      interval: weekly
    # Stay on Python 3.12 until Spark/dbt/pyarrow wheels are verified on newer versions
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.1

  commitizen:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            cz check --rev-range origin/${{ github.event.pull_request.base.ref }}..HEAD
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              cz check --rev-range HEAD~1..HEAD
            else
              echo "Solo existe un commit en el repositorio. Verificando formato..."
              git log -1 --format=%B > .git/committmp
              cz check --commit-msg-file .git/committmp
            fi
          fi
version: 2

models:
  - name: int_nav_daily_classified
    description: "Clasificación de calidad de NAV diario. Grano: class_key x value_date. Material: abs(valor) > neg_dust_max. Dust: 0 < abs(valor) <= neg_dust_max."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key, value_date]
    columns:
      - name: is_dust_holders
        description: "Partícipes negativos con valor absoluto <= neg_dust_max (residuo de redondeo)."
      - name: is_dust_aum
        description: "Patrimonio negativo con valor absoluto <= neg_dust_max (residuo de redondeo)."
      - name: is_dust_nav
        description: "NAV negativo con valor absoluto <= neg_dust_max (residuo de redondeo)."
      - name: is_material_holders
        description: "Partícipes negativos con valor absoluto > neg_dust_max."
      - name: is_material_aum
        description: "Patrimonio negativo con valor absoluto > neg_dust_max."
      - name: is_material_nav
        description: "NAV negativo con valor absoluto > neg_dust_max."
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
      - name: compartment_key
        description: "Clave natural del compartimento (tipo|registro|compartimento); solo trazabilidad, ocultar en Power BI."
      - name: fund_key
        description: "Clave natural del fondo (tipo|registro); solo trazabilidad, ocultar en Power BI."
      - name: class_number
        description: "Número de clase dentro del compartimento."
      - name: compartment_number
        description: "Número de compartimento dentro del fondo (0 si el fondo no tiene compartimentos)."
      - name: registration_number
        description: "Número de registro CNMV del fondo."
      - name: fund_type
        description: "Tipo de institución de inversión colectiva (por ejemplo FI o SICAV)."
      - name: isin
        description: "Código ISIN de la clase."
      - name: holders
        description: "Número de partícipes."
      - name: aum
        description: "Patrimonio en EUR."
      - name: nav
        description: "Valor liquidativo (VL) por participación."
      - name: value_date
        description: "Fecha del valor liquidativo."
      - name: period
        description: "Periodo del fichero de origen (YYYYMM); trazabilidad."
      - name: is_material
        description: "Anomalía material en NAV, AUM o partícipes; se envía a cuarentena."
        tests: [not_null]
      - name: is_dust
        description: "Residuo de redondeo; se conserva en el hecho con flag."
        tests: [not_null]
      - name: is_dormant
        description: "NAV = 0: padding o clase durmiente."
        tests: [not_null]
      - name: quarantine_reason
        description: "Motivos concatenados para filas materiales."

  - name: int_weekly_nav_returns
    description: >
      Serie semanal por clase dentro de la ventana de análisis. Grano: class_key x week_end_date.
      week_end_date es el domingo ISO de la semana; nav_date es el último laborable con precio válido.
      El precio semanal es el último laborable con VL > 0: usar el último laborable sin filtrar produce
      154 retornos extremos en lugar de 25, porque un VL = 0 genera un salto de -100%.
      Los retornos solo se computan entre semanas consecutivas (SRRI: retornos semanales no solapados).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key, week_end_date]
    columns:
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: week_end_date
        description: "Domingo ISO que cierra la semana."
        tests: [not_null]
      - name: nav_date
        description: "Último laborable con precio válido; nulo si la semana no tiene ninguno."
      - name: nav
        description: "Precio liquidativo semanal; nulo si la semana no tiene ningún laborable con precio válido."
      - name: n_days
        description: "Laborables observados en la semana."
        tests: [not_null]
      - name: n_dormant_days
        description: "Laborables de la semana con VL = 0 (padding o clase durmiente)."
        tests: [not_null]
      - name: is_dormant_week
        description: "La semana contiene al menos un laborable con VL = 0; puede conservar un nav válido de otro día."
      - name: ret_w
        description: "Retorno semanal nav / nav de la semana anterior - 1; nulo si no hay semana anterior consecutiva o falta un precio."
      - name: mar_w
        description: "Retorno semanal del índice €STR compuesto; mínimo aceptable de la semana."
      - name: is_gap
        description: "No hay retorno porque falta la semana anterior; la primera semana de la clase no es un hueco."
      - name: is_stale
        description: "Retorno semanal igual a cero: precio congelado."
      - name: is_extreme
        description: "Retorno semanal absoluto por encima de extreme_return_abs."

  - name: int_class_metrics
    description: >
      Métricas de riesgo y rendimiento por clase sobre la ventana de 36 meses. Grano: class_key.
      Las métricas se calculan sobre la serie semanal de retornos no solapados con anualización ×52,
      siguiendo la metodología SRRI de ESMA adaptada a un lookback de 3 años.
      El drawdown procede de la serie diaria laborable porque la semanal infraestimaría los mínimos intra-semana.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key]
    columns:
      - name: n_extreme
        description: "Semanas con retorno semanal extremo (por encima de extreme_return_abs)."
      - name: n_gap
        description: "Semanas sin retorno por falta de la semana anterior consecutiva."
      - name: n_stale
        description: "Semanas con retorno cero (precio congelado)."
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: first_week
        description: "Primer domingo de la ventana con precio válido."
      - name: last_week
        description: "Último domingo de la ventana con precio válido."
      - name: n_weeks
        description: "Semanas de la ventana con precio válido."
        tests: [not_null]
      - name: n_weeks_expected
        description: "Semanas teóricas de la ventana de 36 meses."
        tests: [not_null]
      - name: n_returns
        description: "Semanas con retorno computado."
        tests: [not_null]
      - name: n_dormant_weeks
        description: "Semanas con algún día de VL = 0."
        tests: [not_null]
      - name: coverage_ratio
        description: "Semanas con precio válido sobre las semanas teóricas de la ventana."
      - name: stale_share
        description: "Proporción de retornos iguales a cero sobre los retornos computados."
      - name: gap_share
        description: "Proporción de semanas sin semana anterior consecutiva sobre las semanas con precio válido."
      - name: ret_1y
        description: "Retorno de las últimas 52 semanas: precio final sobre el de hace 52 semanas."
      - name: cagr_3y
        description: "CAGR de la ventana: precio final sobre el inicial, anualizado por días transcurridos."
      - name: vol
        description: "Volatilidad anualizada: desviación muestral semanal de retornos por raíz de 52."
      - name: mean_excess
        description: "Exceso medio anualizado sobre el mínimo aceptable del €STR."
      - name: downside_dev
        description: "Desviación a la baja anualizada frente al mínimo aceptable del €STR."
      - name: sortino
        description: "mean_excess / downside_dev."
      - name: sortino_status
        description: "ok, no_downside (downside_dev bajo el suelo con exceso positivo) o stagnant (volatilidad nula)."
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'no_downside', 'stagnant']
                config:
                  where: "sortino_status is not null"
      - name: max_drawdown
        description: "Mayor caída respecto al pico acumulado en la serie diaria laborable (el pico se reinicia al inicio de la ventana)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: srri_like_class
        description: "Clase de riesgo tipo SRRI (1 a 7) según los cortes oficiales de volatilidad anualizada."
      - name: class_status
        description: "eligible, quarantined o short_history. La cuarentena no excluye la clase del panorama."
        tests:
          - accepted_values:
              arguments:
                values: ['eligible', 'quarantined', 'short_history']
      - name: class_status_reason
        description: "Motivo principal de la cuarentena, por prioridad; nulo si la clase es eligible."
        tests:
          - accepted_values:
              arguments:
                values: ['dormant', 'extreme_return', 'gap_gt_max', 'coverage_lt_min', 'stale_end', 'short_history']
                config:
                  where: "class_status_reason is not null"

  - name: int_representative_class
    description: >
      Clase representativa de cada compartimento. Grano: compartment_key.
      Criterios ordenados: clase activa, ventana completa, divisa de la watchlist,
      más partícipes, mayor patrimonio y más antigua. Los tres primeros son filtros;
      los tres últimos ordenan a las que superan el filtro.
      Un compartimento sin candidata no desaparece: aparece con is_representative = false
      y exclusion_reason = no_eligible_class, para que el panorama pueda explicar la ausencia.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [compartment_key]
    columns:
      - name: compartment_key
        description: "Clave natural del compartimento (tipo|registro|compartimento); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: class_key
        description: "Clase representante; nula si el compartimento no tiene ninguna candidata."
      - name: participants
        description: "Partícipes de la clase representante en la fecha final del periodo."
      - name: aum
        description: "Patrimonio de la clase representante en la fecha final del periodo."
      - name: class_age
        description: "Primera observación de la clase en toda la historia; desempata el criterio de antigüedad."
      - name: is_representative
        description: "True si la clase es la representante del compartimento."
      - name: eligibility_status
        description: "representative o no_eligible_class."
        tests:
          - accepted_values:
              arguments:
                values: ['representative', 'no_eligible_class']
      - name: exclusion_reason
        description: "Motivo de la ausencia de representante; nulo cuando la clase es representante."
        tests:
          - accepted_values:
              arguments:
                values: ['no_eligible_class']
                config:
                  where: "exclusion_reason is not null"

  - name: int_fund_aum_bridge
    description: >
      Puente diario entre patrimonio y valor liquidativo por clase. Grano: class_key x value_date.
      Descompone el cambio de patrimonio en efecto mercado y flujos netos:
      units = aum / nav, market_effect = units_{t-1} * (nav_t - nav_{t-1}),
      net_flows = (units_t - units_{t-1}) * nav_t, y delta_aum = aum_t - aum_{t-1}.
      Solo entran las filas con NAV y AUM positivos: units exige que ambas magnitudes tengan sentido.
      is_jump marca un salto de precio por encima de extreme_return_abs, que no es un flujo de dinero.
      Un reparto de dividendo no necesita marca: no cambia las participaciones, así que el flujo
      es cero y la caída del NAV cae en el efecto mercado. Los repartos oficiales se identifican
      con Beneficio_Dividendo_Bruto de FONDTRIM, no con una heurística sobre el NAV.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key, value_date]
    columns:
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: value_date
        description: "Fecha del valor liquidativo."
        tests: [not_null]
      - name: prev_value_date
        description: "Fecha de la observación anterior de la clase; el puente mide el cambio entre ambas."
        tests: [not_null]
      - name: units
        description: "Participaciones derivadas: aum / nav. No es un dato oficial de CNMV."
        tests: [not_null]
      - name: aum
        description: "Patrimonio en EUR."
        tests: [not_null]
      - name: nav
        description: "Valor liquidativo (VL) por participación."
        tests: [not_null]
      - name: market_effect
        description: "Cambio de patrimonio atribuible al valor liquidativo."
        tests: [not_null]
      - name: net_flows
        description: "Cambio de patrimonio atribuible a las participaciones."
        tests: [not_null]
      - name: delta_aum
        description: "Cambio total de patrimonio: delta_aum = market_effect + net_flows."
        tests: [not_null]
      - name: market_growth
        description: "market_effect / aum del día anterior."
      - name: total_growth
        description: "delta_aum / aum del día anterior."
      - name: is_jump
        description: "Salto de precio superior a extreme_return_abs: cambio de identidad, no flujo."
      - name: is_capital_change
        description: >
          Salto del patrimonio acompañado de salto del valor liquidativo: fusión, cambio de clase
          o incorporación de otra clase. El patrimonio aparece o desaparece sin que entre ni salga dinero.
          Un salto del patrimonio con el valor liquidativo estable NO es un cambio de capital:
          es dinero real entrando o saliendo.


  - name: int_class_entry_exit
    description: >
      Patrimonio que entra o sale del mercado porque una clase empieza o deja de publicar dentro
      de la ventana. Grano: class_key x event. El puente diario solo mide flujos entre dos
      observaciones de la misma clase: un fondo que cierra o se fusiona en otro desaparece sin
      registrar salida, mientras el fondo absorbente sí registra la entrada como suscripción, así
      que sumar flujos entre fondos sobrestimaba el dinero nuevo. Entrada: primera observación de
      una clase que empieza dentro de la ventana (+aum). Salida: última observación de una clase
      que deja de publicar antes del mes de corte (-aum), con fecha del día siguiente. Una clase
      que ya publicaba al inicio de la ventana no es entrada, una que sigue publicando en el mes
      de corte no es salida, y una que falta un mes y vuelve no es ninguna de las dos.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key, event]
    columns:
      - name: class_key
        description: "Clave natural de la clase."
        tests: [not_null]
      - name: value_date
        description: "Día del movimiento: primera observación (entrada) o el día siguiente a la última (salida)."
        tests: [not_null]
      - name: event
        description: "entry o exit."
        tests:
          - accepted_values:
              arguments:
                values: ['entry', 'exit']
      - name: entry_exit_flows
        description: "Patrimonio que entra (positivo) o sale (negativo) con el alta o el cierre de la clase."
        tests: [not_null]

  - name: int_compartment_manager_group_monthly
    description: >
      Grupo gestor de cada compartimento en cada mes, tal como lo publicaba FONDREGISTRO entonces.
      Grano: compartment_key x month_key. dim_compartment guarda el último grupo conocido (tipo 1),
      que sirve para saber quién gestiona hoy el fondo pero no para la historia: aplicado a todos los
      meses, adelanta las absorciones (los fondos de Bankia contaban como de CaixaBank en 2020, un año
      antes de la fusión). Los hechos que siguen a los grupos en el tiempo (cuota, concentración,
      flujos por grupo) usan este modelo con un ASOF join por mes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [compartment_key, month_key]
    columns:
      - name: compartment_key
        description: "Clave natural del compartimento."
        tests: [not_null]
      - name: month_key
        description: "Mes del registro de FONDREGISTRO (YYYYMM)."
        tests: [not_null]
      - name: manager_group_name
        description: "Grupo gestor publicado ese mes."
        tests: [not_null]
      - name: manager_group_id
        description: "Clave hacia dim_manager_group."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_manager_group')
                field: manager_group_id

  - name: int_fund_peer_ranking
    description: >
      Percentil y cuartil dentro de la vocación para todos los compartimentos invertibles
      (clase representativa elegible con Sortino). Grano: compartment_key.
      Incluye la selección de la watchlist (watchlist_rank): mejores fondos por pct_exact (el percentil
      redondeado empata a 16 fondos en el percentil 1), con tope por vocación (max_per_vocacion), por
      familia (watchlist_per_family) y global (watchlist_max). Lo lee mart_fund_panorama.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [compartment_key]
    columns:
      - name: star_rating
        description: "Calificación de 1 a 5 por percentil dentro de la vocación; proxy propio, no es un rating oficial."
      - name: quartile_in_vocation
        description: "Cuartil dentro de la vocación (1 es el mejor); nulo si el grupo es pequeño."
      - name: percentile_in_vocation
        description: "Percentil redondeado dentro de la vocación (1 es el mejor, 100 el peor); nulo si hay menos de min_peer_group_size pares."
      - name: n_peers
        description: "Tamaño del grupo de pares: compartimentos de la misma vocación con Sortino."
      - name: pct_exact
        description: "Percentil continuo dentro de la vocación: 100 * (puesto - 1) / (n - 1); 0 es el mejor."
      - name: cagr_3y
        description: "Rentabilidad anualizada compuesta (CAGR) del NAV semanal en la ventana de análisis; fracción."
      - name: sortino
        description: "Ratio de Sortino anualizado de la clase frente al €STR semanal (mínimo aceptable)."
      - name: aum
        description: "Patrimonio en EUR."
      - name: vocation_family
        description: "Familia de vocación; agrupa las vocaciones."
      - name: vocation
        description: "Vocación inversora CNMV (normalizada con el seed vocation_aliases)."
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
      - name: compartment_key
        description: "Clave natural del compartimento (tipo|registro|compartimento); solo trazabilidad, ocultar en Power BI."
      - name: watchlist_rank
        description: "Posición global en la watchlist (1 es el mejor); nulo si el compartimento no está seleccionado."

  - name: int_active_class_as_of
    description: >
      Clases activas en la fecha de corte: AUM y partícipes positivos el último día
      con datos del periodo. Grano: class_id.
      Fuente única para int_representative_class, mart_fund_panorama y mart_fund_class_status.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_id]
    columns:
      - name: class_id
        description: "Clave sustituta de la clase; relaciona con dim_class."
        tests: [not_null]
      - name: class_key
        description: "Clave natural de la clase (tipo|registro|compartimento|clase); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: compartment_id
        description: "Clave sustituta del compartimento; relaciona con dim_compartment."
        tests: [not_null]
      - name: compartment_key
        description: "Clave natural del compartimento (tipo|registro|compartimento); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: aum
        description: "Patrimonio en EUR."
        tests: [not_null]
      - name: participants
        description: "Número de partícipes."
        tests: [not_null]

  - name: int_active_compartment_as_of
    description: >
      Compartimentos activos en la fecha de corte: suma de AUM y partícipes de sus
      clases activas. Grano: compartment_id.
      Fuente única para mart_fund_panorama y la selección de la watchlist.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [compartment_id]
    columns:
      - name: compartment_id
        description: "Clave sustituta del compartimento; relaciona con dim_compartment."
        tests: [not_null]
      - name: aum
        description: "Patrimonio en EUR."
        tests: [not_null]
      - name: participants
        description: "Número de partícipes."
        tests: [not_null]

  - name: int_weekly_nav_returns_5y
    description: >
      Serie semanal por clase dentro de la ventana larga de 5 años (window_months_long).
      Mismas reglas que int_weekly_nav_returns (macro weekly_nav_returns); el €STR semanal
      se construye en línea para esta ventana, de modo que fact_estr_weekly conserva la de 36 meses.
      Grano: class_key x week_end_date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key, week_end_date]
    columns:
      - name: class_key
        description: "Clave natural de la clase."
        tests: [not_null]
      - name: week_end_date
        description: "Domingo ISO de la semana."
        tests: [not_null]

  - name: int_class_metrics_5y
    description: >
      Métricas de riesgo y rendimiento por clase sobre la ventana de 5 años, con las mismas fórmulas
      y el mismo filtro de calidad que int_class_metrics (macro class_metrics). Grano: class_key.
      Se publican junto a las de 36 meses en mart_fund_panorama; el ranking y la watchlist no las usan.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [class_key]
    columns:
      - name: class_key
        description: "Clave natural de la clase."
        tests: [not_null]
      - name: cagr_5y
        description: "CAGR de la ventana de 5 años: precio final sobre el inicial, anualizado por días transcurridos."
      - name: max_drawdown
        description: "Mayor caída respecto al pico acumulado en la serie diaria laborable de la ventana de 5 años."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: class_status
        description: "eligible, quarantined o short_history sobre la ventana de 5 años."
        tests:
          - accepted_values:
              arguments:
                values: ['eligible', 'quarantined', 'short_history']

version: 2

models:
  - name: mart_fund_anomalies
    description: >
      Anomalías tipadas detectadas en la plataforma. Grano: fund_key x compartment_key x period x anomaly_type x class_key.
      Una fila por anomalía detectada, no por clase: una clase con tres anomalías tiene tres filas.
      La clase forma parte de la clave porque las anomalías de la serie de NAV y de calidad se detectan
      a nivel de clase, y sin ella no se puede saber sobre qué actuar.
      La severidad high reserva revisión manual y nunca elimina un fondo por sí sola.
      Los periodos de los tipos de flujo y de fee son mensuales; los de la serie semanal, trimestrales.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [as_of_period, fund_id, compartment_id, period, anomaly_type, class_id]
    columns:
      - name: as_of_period
        tests: [not_null]
      - name: fund_id
        tests: [not_null]
      - name: compartment_id
        tests: [not_null]
      - name: class_id
        description: "Clase donde se detecta la anomalía; nula en las de compartimento."
      - name: period
        description: "Periodo de la anomalía: mes para flujos y fees, trimestre para la serie de NAV."
        tests: [not_null]
      - name: anomaly_type
        description: "Tipo de anomalía detectada."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'nav_extreme_return'
                  - 'nav_gap'
                  - 'nav_stale'
                  - 'dormant'
                  - 'coverage_lt_min'
                  - 'stale_end'
                  - 'short_history'
                  - 'recon_error'
                  - 'fee_outlier'
                  - 'fee_period_missing'
                  - 'flow_extreme_outflow'
      - name: severity
        description: "info, warn o high. La severidad high exige revisión manual."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['info', 'warn', 'high']
      - name: metric_value
        description: "Valor observado que dispara la anomalía."
      - name: threshold
        description: "Umbral contra el que se compara el valor observado."
      - name: source
        description: "Modelo o tabla de la que procede la detección."
        tests: [not_null]
      - name: description
        description: "Explicación legible de la anomalía."
        tests: [not_null]

  - name: stg_fund_holdings
    description: "FONDCART: posiciones de cartera por compartimento y periodo. Grano:  compartment_key x period x linea (puede haber líneas repetidas del mismo instrumento)."
    columns:
      - name: asset_currency
        description: "Campo `Divisa` de FONDCART."
      - name: asset_description
        description: "Campo `DescripcionValor` de FONDCART."
      - name: asset_if_description
        description: "Campo `DescripcionIF` de FONDCART."
      - name: compartment_number
        description: "Campo `NumeroCompartimento` de FONDCART."
      - name: registration_number
        description: "Campo `NumeroRegistro` de FONDCART."
      - name: fund_type
        description: "Campo `Tipo` de FONDCART."
      - name: fund_key
        description: "Clave natural del fondo (tipo|registro); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: compartment_key
        description: "Clave natural del compartimento (tipo|registro|compartimento); solo trazabilidad, ocultar en Power BI."
        tests: [not_null]
      - name: period
        description: "Periodo del fichero de origen (YYYYMM); trazabilidad."
        tests: [not_null]
      - name: position_value
        description: "Valor de mercado en euros. 38 posiciones <= 0 en los datos reales; se tratan en cartera."
        tests: [not_null]
      - name: isin
        description: "1.296 posiciones sin ISIN; el intrumento se identifica por ClaseIF + DescripcionIF."
      - name: asset_if_class
        description: "INTERIOR / EXTERIOR / DUDOSAS"
        tests:
          - accepted_values:
              arguments:
                values: ['INTERIOR', 'EXTERIOR', 'DUDOSAS']

  - name: stg_estr_daily
    description: "BCE €STR en formato largo: índice CI y media compuesta 12M CR. Grano: series x value_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series, value_date]
    columns:
      - name: obs_status
        description: "Estado de la observación del BCE (por ejemplo A = normal)."
      - name: series
        description: "Identificador de la serie del BCE (índice compuesto del €STR)."
        tests: [not_null]
      - name: value_date
        description: "Fecha del valor liquidativo."
        tests: [not_null]
      - name: series_value
        description: "Valor de la serie: nivel del índice para .CI, tasa para .CR. Puede ser negativo en .CR."
        tests: [not_null]
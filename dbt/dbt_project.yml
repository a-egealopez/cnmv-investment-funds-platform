name: cnmv
version: "0.1.0"
config-version: 2
profile: cnmv

vars:
  neg_dust_max: 1

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  cnmv:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    quality:
      +materialized: table
    gold:
      +materialized: table
    marts:
      +materialized: view